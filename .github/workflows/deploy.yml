name: Deploy Flet Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Dependencies
        run: uv sync

      - name: Build Flet Web App
        run: |
          yes | uv run flet build web --base-url /org.flettts.demo/
          python3 -c "
          with open('build/web/python.js', 'r') as f:
              content = f.read()
          target = 'app.worker.onmessage = (event) => {'
          replacement = '''app.worker.onmessage = (event) => {
                  if (event.data && event.data.tts_b64) {
                      if (window.__flet_tts_audio) {
                          try { window.__flet_tts_audio.pause(); } catch(e){}
                      }
                      window.__flet_tts_audio = new Audio('data:audio/mp3;base64,' + event.data.tts_b64);
                      window.__flet_tts_audio.play().catch(function(err){ console.log('Audio playback error:', err); });
                      return;
                  }
                  if (event.data && event.data.tts_stop) {
                      if (window.__flet_tts_audio) {
                          try { window.__flet_tts_audio.pause(); window.__flet_tts_audio.currentTime = 0; } catch(e){}
                      }
                      return;
                  }'''
          if target in content:
              content = content.replace(target, replacement, 1)
              with open('build/web/python.js', 'w') as f:
                  f.write(content)
              print('Successfully injected HTML5 web audio handler into python.js')
          else:
              print('Warning: Target app.worker.onmessage not found in python.js')
          "

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
